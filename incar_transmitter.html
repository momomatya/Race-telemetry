<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>IN-CAR TELEMETRY TX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Barlow Condensed', sans-serif;
      background-color: #05070a;
      color: #f1f5f9;
      overflow: hidden;
      touch-action: manipulation;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between select-none">

  <div class="relative flex-1 bg-black overflow-hidden flex items-center justify-center">
    <video id="cameraPreview" class="w-full h-full object-contain" autoplay playsinline muted></video>

    <div class="absolute top-3 left-3 right-3 flex flex-wrap items-center justify-between gap-2 bg-slate-950/80 backdrop-blur-md border border-white/15 px-3 py-2 rounded">
      <div class="flex items-center gap-2">
        <span id="txDot" class="w-3 h-3 rounded-full bg-slate-500"></span>
        <span id="txStatus" class="text-sm font-bold tracking-wider uppercase">STANDBY</span>
      </div>
      <div class="flex items-center gap-1.5 text-xs mono">
        <span id="gpsBadge" class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-white/10">GPS: INIT</span>
        <span id="lensBadge" class="px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-500/30">LENS: AUTO</span>
        <span id="bleBadge" class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-white/10">M5 BLE: OFF</span>
        <span id="pitBadge" class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-white/10">PIT PC: 0</span>
      </div>
    </div>

    <div class="absolute bottom-3 left-3 right-3 bg-slate-950/85 backdrop-blur-md border border-white/10 p-2 rounded grid grid-cols-6 gap-1.5 text-center">
      <div>
        <div class="text-[10px] text-slate-400">SPEED</div>
        <div id="valSpd" class="text-xl font-extrabold italic text-white mono">0</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-400">RPM</div>
        <div id="valRpm" class="text-xl font-extrabold italic text-cyan-400 mono">0</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-400">THR %</div>
        <div id="valThr" class="text-xl font-extrabold italic text-emerald-400 mono">0</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-400">BRK %</div>
        <div id="valBrk" class="text-xl font-extrabold italic text-rose-500 mono">0</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-400">LAP</div>
        <div id="valLap" class="text-lg font-extrabold text-amber-400 mono">L1</div>
      </div>
      <div>
        <div class="text-[10px] text-slate-400">DIST (m)</div>
        <div id="valDist" class="text-sm font-bold text-slate-200 mono mt-1">0m</div>
      </div>
    </div>
  </div>

  <div class="bg-slate-900 border-t border-white/15 p-3 space-y-2">
    <div class="flex items-center gap-1.5">
      <div class="flex items-center bg-slate-950 border border-white/15 rounded px-2 py-1.5 flex-1 min-w-0">
        <span class="text-xs text-slate-400 mr-1.5 font-bold">ROOM:</span>
        <input id="roomInput" type="text" value="ND-27" class="bg-transparent text-cyan-400 font-bold mono text-base w-full focus:outline-none uppercase" />
      </div>
      <button id="btnQuality" class="px-2.5 py-2 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-cyan-300 text-xs font-extrabold rounded border border-cyan-500/40 shadow shrink-0">
        📺 720p
      </button>
      <button id="btnWideLens" class="px-2.5 py-2 bg-cyan-700 hover:bg-cyan-600 active:bg-cyan-800 text-white text-xs font-extrabold rounded border border-cyan-400/40 shadow shrink-0">
        📐 レンズ
      </button>
      <button id="btnDemo" class="px-2.5 py-2 bg-amber-500/20 border border-amber-400/50 text-amber-300 text-xs font-bold rounded shrink-0">
        DEMO: ON
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <button id="btnBle" class="py-2.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold text-sm rounded tracking-wider shadow">
1. CONNECT M5 BLE
      </button>
      <button id="btnStartTx" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-extrabold text-base rounded tracking-wider shadow-lg">
2. START TX (配信開始)
      </button>
    </div>
    <div id="logBox" class="text-[11px] mono text-slate-400 truncate">BLE自動再接続＋Solo 2 DL優先＋スマホ内蔵GPSライン検知対応。</div>
  </div>

  <script>
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    const PEER_CONFIG = {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    };

    // 各サーキットのコントロールライン（スタート/フィニッシュライン）中心座標・検知半径(m)・最小ラップ秒数（8サーキット対応）
    const CIRCUIT_START_LINES = {
      fsw:       { name: 'FSW',       lat: 35.37222, lon: 138.92694, radiusM: 28, minLapSec: 85, lengthM: 4563 },
      motegi:    { name: 'MOTEGI',    lat: 36.53310, lon: 140.22665, radiusM: 28, minLapSec: 90, lengthM: 4801 },
      sugo:      { name: 'SUGO',      lat: 38.13860, lon: 140.77530, radiusM: 28, minLapSec: 70, lengthM: 3586 },
      nikko:     { name: 'NIKKO',     lat: 36.68755, lon: 139.84062, radiusM: 22, minLapSec: 32, lengthM: 1047 },
      sodegaura: { name: 'SODEGAURA', lat: 35.40835, lon: 140.07115, radiusM: 25, minLapSec: 55, lengthM: 2436 },
      tsukuba:   { name: 'TC2000',    lat: 36.17975, lon: 139.98895, radiusM: 25, minLapSec: 48, lengthM: 2045 },
      mobara:    { name: 'MOBARA',    lat: 35.43075, lon: 140.25180, radiusM: 22, minLapSec: 38, lengthM: 1170 },
      honjo:     { name: 'HONJO',     lat: 36.20390, lon: 139.13170, radiusM: 22, minLapSec: 36, lengthM: 1112 }
    };

    let localStream = null;
    let videoDevices = [];
    let currentDeviceIndex = -1;
    let is1080p = false;
    let peer = null;
    let activeDataConns = [];
    let isDemoMode = true;
    let bleConnected = false;
    let hasSoloTimingStream = false;
    let demoPhase = 0;

    // BLE自動再接続用ステート
    let bleDevice = null;
    let bleTxChar = null;
    let bleRxBuffer = '';
    let bleAutoReconnect = false;
    let bleReconnectTimer = null;
    let bleReconnectAttempts = 0;
    let isBleConnecting = false;

    // スマホ内蔵GPSによるライン通過＆ラップ計測用ステート（Solo 2 DL未接続時のフォールバック）
    let phoneGpsState = {
      active: false,
      nearestCircuitKey: 'fsw',
      lat: undefined,
      lon: undefined,
      spdKmh: 0,
      lap: 1,
      distM: 0,
      lapStartMs: performance.now(),
      lapTime: 0,
      lastLap: 0,
      lastCrossMs: 0,
      lastUpdateMs: performance.now()
    };

    let latestTelemetry = {
      spd: 0, rpm: 850, gear: 1, thr: 0, brk: 0, gx: 0, gy: 0, steer: 0,
      wtemp: 85, fuel: 0, trk: undefined, lap: 1, distM: 0, lapTime: 0, lastLap: 0, lat: undefined, lon: undefined
    };

    function logMsg(msg) {
      console.log(msg);
      document.getElementById('logBox').textContent = msg;
    }

    // 2点間の距離(m)を計算
    function calcDistMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // スマホ内蔵GPSウォッチャー（Solo 2 DLからタイム情報が来ていない時にライン通過を自動検知）
    function initPhoneGpsTracker() {
      if (!navigator.geolocation) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const nowMs = performance.now();
          const dtSec = Math.min(1.0, Math.max(0, (nowMs - phoneGpsState.lastUpdateMs) / 1000));
          phoneGpsState.lastUpdateMs = nowMs;

          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          phoneGpsState.lat = lat;
          phoneGpsState.lon = lon;
          phoneGpsState.active = true;

          if (typeof pos.coords.speed === 'number' && pos.coords.speed >= 0) {
            phoneGpsState.spdKmh = pos.coords.speed * 3.6;
          }

          // 最寄りサーキットの特定
          let bestKey = phoneGpsState.nearestCircuitKey;
          let minD = Infinity;
          for (const [k, c] of Object.entries(CIRCUIT_START_LINES)) {
            const d = calcDistMeters(lat, lon, c.lat, c.lon);
            if (d < minD) {
              minD = d;
              bestKey = k;
            }
          }
          phoneGpsState.nearestCircuitKey = bestKey;
          const targetLine = CIRCUIT_START_LINES[bestKey];

          // スタート/フィニッシュライン半径内を通過したか判定
          const distToLineM = calcDistMeters(lat, lon, targetLine.lat, targetLine.lon);
          const elapsedSinceLastCrossSec = (nowMs - phoneGpsState.lastCrossMs) / 1000;

          if (distToLineM <= targetLine.radiusM && elapsedSinceLastCrossSec >= targetLine.minLapSec) {
            if (phoneGpsState.lastCrossMs > 0) {
              phoneGpsState.lastLap = (nowMs - phoneGpsState.lapStartMs) / 1000;
              phoneGpsState.lap += 1;
              logMsg(`🏁 [${targetLine.name}] LINE CROSS! L${phoneGpsState.lap} (LAST: ${phoneGpsState.lastLap.toFixed(2)}s)`);
            }
            phoneGpsState.lastCrossMs = nowMs;
            phoneGpsState.lapStartMs = nowMs;
            phoneGpsState.distM = 0;
          } else {
            const useSpd = bleConnected ? latestTelemetry.spd : phoneGpsState.spdKmh;
            phoneGpsState.distM += (useSpd / 3.6) * dtSec;
          }

          phoneGpsState.lapTime = (nowMs - phoneGpsState.lapStartMs) / 1000;

          const gpsBadge = document.getElementById('gpsBadge');
          gpsBadge.textContent = hasSoloTimingStream ? 'GPS: SOLO2 25Hz' : `GPS: ${targetLine.name}`;
          gpsBadge.className = 'px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-500/40 font-bold';
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }

    async function loadVideoDevices() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const allCams = devices.filter(d => d.kind === 'videoinput');
        const backCams = allCams.filter(d => !d.label.toLowerCase().includes('front') && !d.label.toLowerCase().includes('前面'));
        videoDevices = backCams.length > 0 ? backCams : allCams;

        const ultraIdx = videoDevices.findIndex(d => {
          const l = d.label.toLowerCase();
          return l.includes('ultra') || l.includes('超広角') || l.includes('0.5') || l.includes('wide');
        });
        if (ultraIdx !== -1 && currentDeviceIndex === -1) {
          currentDeviceIndex = ultraIdx;
        } else if (currentDeviceIndex === -1 && videoDevices.length > 0) {
          currentDeviceIndex = 0;
        }
      } catch (e) {}
    }

    async function startCamera(specificDeviceId = null) {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      try {
        const videoConstraints = {
          width: { ideal: is1080p ? 1920 : 1280 },
          height: { ideal: is1080p ? 1080 : 720 },
          frameRate: { ideal: 30 }
        };

        if (specificDeviceId) {
          videoConstraints.deviceId = { exact: specificDeviceId };
        } else {
          videoConstraints.facingMode = { ideal: 'environment' };
        }

        localStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: false
        });

        if (videoDevices.length === 0) {
          await loadVideoDevices();
        }

        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
          const resLabel = (settings.height) ? `${settings.height}p` : (is1080p ? '1080p' : '720p');
          const label = videoTrack.label || `CAM #${currentDeviceIndex + 1}`;
          document.getElementById('lensBadge').textContent = `${resLabel} ${label.substring(0, 12)}`;

          if (videoTrack.getCapabilities) {
            const caps = videoTrack.getCapabilities();
            if (caps.zoom && typeof caps.zoom.min === 'number') {
              await videoTrack.applyConstraints({
                advanced: [{ zoom: caps.zoom.min }]
              }).catch(() => {});
            }
          }
        }

        const videoEl = document.getElementById('cameraPreview');
        videoEl.srcObject = localStream;
        await videoEl.play().catch(() => {});

        activeDataConns.forEach(conn => {
          if (conn.open && peer) {
            peer.call(conn.peer, localStream);
          }
        });

        return true;
      } catch (err) {
        logMsg('Camera Error: ' + err.message);
        return false;
      }
    }

    // 720p / 1080p 画質切替ボタン
    const btnQuality = document.getElementById('btnQuality');
    btnQuality.addEventListener('click', async () => {
      is1080p = !is1080p;
      if (is1080p) {
        btnQuality.textContent = '📺 1080p';
        btnQuality.className = 'px-2.5 py-2 bg-rose-700 hover:bg-rose-600 active:bg-rose-800 text-white text-xs font-extrabold rounded border border-rose-400/50 shadow shrink-0';
        logMsg('解像度を 1080p (Full HD) に切り替えました');
      } else {
        btnQuality.textContent = '📺 720p';
        btnQuality.className = 'px-2.5 py-2 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-cyan-300 text-xs font-extrabold rounded border border-cyan-500/40 shadow shrink-0';
        logMsg('解像度を 720p (HD・安定) に切り替えました');
      }
      const curId = (currentDeviceIndex >= 0 && videoDevices[currentDeviceIndex])
        ? videoDevices[currentDeviceIndex].deviceId
        : null;
      await startCamera(curId);
    });

    document.getElementById('btnWideLens').addEventListener('click', async () => {
      await loadVideoDevices();
      if (videoDevices.length <= 1) {
        await startCamera();
        return;
      }
      currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
      const targetCam = videoDevices[currentDeviceIndex];
      await startCamera(targetCam.deviceId);
    });

    const btnDemo = document.getElementById('btnDemo');
    btnDemo.addEventListener('click', () => {
      isDemoMode = !isDemoMode;
      btnDemo.textContent = isDemoMode ? 'DEMO: ON' : 'DEMO: OFF';
      btnDemo.className = isDemoMode
        ? 'px-2.5 py-2 bg-amber-500/20 border border-amber-400/50 text-amber-300 text-xs font-bold rounded shrink-0'
        : 'px-2.5 py-2 bg-slate-800 border border-white/10 text-slate-400 text-xs font-bold rounded shrink-0';
    });

    // BLE受信データハンドラ（再接続時にリスナー重複しないよう関数化）
    function onBleDataReceived(e) {
      const chunk = new TextDecoder().decode(e.target.value);
      bleRxBuffer += chunk;
      let lines = bleRxBuffer.split('\n');
      bleRxBuffer = lines.pop();
      for (let line of lines) {
        if (!line.trim()) continue;
        try {
          const d = JSON.parse(line);
          if (typeof d.distM === 'number' && typeof d.lapTime === 'number') {
            hasSoloTimingStream = true;
          }
          latestTelemetry = {
            spd: d.spd ?? 0,
            rpm: d.rpm ?? 0,
            gear: d.gear ?? 1,
            thr: d.thr ?? 0,
            brk: d.brk ?? 0,
            gx: d.gx ?? 0,
            gy: d.gy ?? 0,
            steer: d.steer ?? 0,
            wtemp: d.wtemp ?? 85,
            fuel: d.fuel ?? 0,
            trk: d.trk ?? undefined,
            // Solo 2 DLのタイム・距離・GPSがあれば優先し、無ければスマホ内蔵GPSのライン検知値を使用
            lap: d.lap ?? phoneGpsState.lap,
            distM: d.distM ?? phoneGpsState.distM,
            lapTime: d.lapTime ?? phoneGpsState.lapTime,
            lastLap: d.lastLap ?? phoneGpsState.lastLap,
            lat: (d.lat && Math.abs(d.lat) > 20) ? d.lat : phoneGpsState.lat,
            lon: (d.lon && Math.abs(d.lon) > 20) ? d.lon : phoneGpsState.lon
          };
        } catch (err) {}
      }
    }

    function setBleBadgeState(state, detail = '') {
      const badge = document.getElementById('bleBadge');
      if (state === 'linked') {
        badge.textContent = 'M5 BLE: LINKED';
        badge.className = 'px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 font-bold';
      } else if (state === 'reconnecting') {
        badge.textContent = `M5 BLE: RETRY${detail ? ' #' + detail : '...'}`;
        badge.className = 'px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/50 font-bold animate-pulse';
      } else {
        badge.textContent = 'M5 BLE: OFF';
        badge.className = 'px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-white/10';
      }
    }

    function clearBleReconnectTimer() {
      if (bleReconnectTimer) {
        clearTimeout(bleReconnectTimer);
        bleReconnectTimer = null;
      }
    }

    function scheduleBleReconnect() {
      if (!bleAutoReconnect || !bleDevice || bleConnected) return;
      clearBleReconnectTimer();
      bleReconnectAttempts += 1;
      setBleBadgeState('reconnecting', bleReconnectAttempts);
      logMsg(`BLE切断検知: Tab5復帰待ちで自動再接続中... (${bleReconnectAttempts}回目)`);

      bleReconnectTimer = setTimeout(async () => {
        if (!bleAutoReconnect || !bleDevice || bleConnected) return;
        const ok = await connectBleDevice(bleDevice, true);
        if (!ok && bleAutoReconnect && !bleConnected) {
          scheduleBleReconnect();
        }
      }, 2000);
    }

    function onBleDisconnected() {
      bleConnected = false;
      bleRxBuffer = '';
      if (bleTxChar) {
        try { bleTxChar.removeEventListener('characteristicvaluechanged', onBleDataReceived); } catch (e) {}
        bleTxChar = null;
      }
      if (bleAutoReconnect) {
        bleReconnectAttempts = 0;
        scheduleBleReconnect();
      } else {
        setBleBadgeState('off');
        logMsg('M5Stack BLE が切断されました');
      }
    }

    async function connectBleDevice(device, isRetry = false) {
      if (isBleConnecting) return false;
      isBleConnecting = true;
      try {
        if (!device._hasDisconnectListener) {
          device.addEventListener('gattserverdisconnected', onBleDisconnected);
          device._hasDisconnectListener = true;
        }

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        const char = await service.getCharacteristic(NUS_TX_CHAR_UUID);

        if (bleTxChar && bleTxChar !== char) {
          try { bleTxChar.removeEventListener('characteristicvaluechanged', onBleDataReceived); } catch (e) {}
        }
        bleTxChar = char;
        bleRxBuffer = '';
        bleTxChar.removeEventListener('characteristicvaluechanged', onBleDataReceived);
        bleTxChar.addEventListener('characteristicvaluechanged', onBleDataReceived);
        await bleTxChar.startNotifications();

        clearBleReconnectTimer();
        bleConnected = true;
        bleAutoReconnect = true;
        bleReconnectAttempts = 0;
        isDemoMode = false;
        btnDemo.textContent = 'DEMO: OFF';
        btnDemo.className = 'px-2.5 py-2 bg-slate-800 border border-white/10 text-slate-400 text-xs font-bold rounded shrink-0';
        setBleBadgeState('linked');
        logMsg(isRetry ? '✅ M5Stack BLE 自動再接続に成功しました！' : 'M5Stack & Solo 2 DL Linked! (自動再接続ON)');
        return true;
      } catch (err) {
        if (!isRetry) {
          logMsg('BLE Error: ' + err.message);
        }
        return false;
      } finally {
        isBleConnecting = false;
      }
    }

    document.getElementById('btnBle').addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        logMsg('Web Bluetooth非対応ブラウザです（Android Chrome / iOS Bluefy推奨）');
        return;
      }
      clearBleReconnectTimer();
      try {
        logMsg('M5Stackを検索中...');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'M5' }],
          optionalServices: [NUS_SERVICE_UUID]
        });
        if (bleDevice && bleDevice !== device && bleDevice._hasDisconnectListener) {
          try { bleDevice.removeEventListener('gattserverdisconnected', onBleDisconnected); } catch (e) {}
          bleDevice._hasDisconnectListener = false;
        }
        bleDevice = device;
        await connectBleDevice(bleDevice, false);
      } catch (err) {
        logMsg('BLE Error: ' + err.message);
      }
    });

    document.getElementById('btnStartTx').addEventListener('click', async () => {
      const roomCode = document.getElementById('roomInput').value.trim().toUpperCase();
      if (!roomCode) return;

      if (!localStream) {
        const ok = await startCamera();
        if (!ok) return;
      }

      if (peer) peer.destroy();
      activeDataConns = [];

      const peerId = 'RACE-CAR-' + roomCode;
      peer = new Peer(peerId, PEER_CONFIG);

      peer.on('open', () => {
        document.getElementById('txDot').className = 'w-3 h-3 rounded-full bg-emerald-400 animate-ping';
        document.getElementById('txStatus').textContent = 'ON AIR: ' + roomCode;
        document.getElementById('btnStartTx').textContent = 'TRANSMITTING (配信中)';
        document.getElementById('btnStartTx').className = 'py-2.5 bg-cyan-600 text-white font-extrabold text-base rounded tracking-wider shadow-lg';
      });

      peer.on('connection', (conn) => {
        activeDataConns.push(conn);
        updatePitCount();

        conn.on('open', () => {
          if (localStream) {
            peer.call(conn.peer, localStream);
          }
        });

        conn.on('data', (data) => {
          if (data && data.type === 'REQUEST_VIDEO' && localStream) {
            peer.call(conn.peer, localStream);
          }
        });

        conn.on('close', () => {
          activeDataConns = activeDataConns.filter(c => c !== conn);
          updatePitCount();
        });
      });

      peer.on('call', (call) => {
        if (localStream) {
          call.answer(localStream);
        }
      });
    });

    function updatePitCount() {
      const count = activeDataConns.filter(c => c.open).length;
      const badge = document.getElementById('pitBadge');
      badge.textContent = `PIT PC: ${count}`;
      badge.className = count > 0
        ? 'px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-400/50 font-bold'
        : 'px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-white/10';
    }

    setInterval(() => {
      if (!bleConnected) {
        if (isDemoMode) {
          demoPhase += 0.05;
          const wave = Math.sin(demoPhase);
          const brkZone = wave < -0.25 ? Math.min(100, Math.round((-wave - 0.25) * 145)) : 0;
          const thrZone = brkZone === 0 ? Math.min(100, Math.max(0, Math.round((wave + 0.3) * 90))) : 0;
          const spd = Math.round(135 + wave * 65);
          latestTelemetry = {
            spd: spd,
            rpm: Math.round(3800 + (spd % 45) * 80),
            gear: spd > 175 ? 5 : spd > 135 ? 4 : spd > 95 ? 3 : 2,
            thr: thrZone,
            brk: brkZone,
            gx: Number((brkZone > 0 ? -brkZone * 0.012 : thrZone * 0.004).toFixed(2)),
            gy: Number((Math.cos(demoPhase * 0.8) * 1.15).toFixed(2)),
            steer: Math.round(Math.cos(demoPhase * 0.8) * 95),
            lat: phoneGpsState.lat,
            lon: phoneGpsState.lon
          };
        } else {
          // DEMO OFF かつ BLE未接続時はスマホ内蔵GPSの車速・ライン通過判定で動作
          latestTelemetry = {
            spd: Math.round(phoneGpsState.spdKmh || 0),
            rpm: 850,
            gear: 1,
            thr: 0,
            brk: 0,
            gx: 0,
            gy: 0,
            steer: 0,
            lap: phoneGpsState.lap,
            distM: phoneGpsState.distM,
            lapTime: phoneGpsState.lapTime,
            lastLap: phoneGpsState.lastLap,
            lat: phoneGpsState.lat,
            lon: phoneGpsState.lon
          };
        }
      }

      document.getElementById('valSpd').textContent = Math.round(latestTelemetry.spd);
      document.getElementById('valRpm').textContent = Math.round(latestTelemetry.rpm);
      document.getElementById('valThr').textContent = Math.round(latestTelemetry.thr);
      document.getElementById('valBrk').textContent = Math.round(latestTelemetry.brk);
      document.getElementById('valLap').textContent = latestTelemetry.lap ? `L${latestTelemetry.lap}` : 'L1';
      document.getElementById('valDist').textContent = latestTelemetry.distM !== undefined ? `${Math.round(latestTelemetry.distM)}m` : '0m';

      const payload = {
        t: Date.now(),
        ...latestTelemetry
      };
      activeDataConns.forEach(conn => {
        if (conn.open) {
          conn.send(payload);
        }
      });
    }, 40);

    window.addEventListener('load', async () => {
      initPhoneGpsTracker();
      await startCamera();
      await loadVideoDevices();
      if (currentDeviceIndex > 0 && videoDevices[currentDeviceIndex]) {
        await startCamera(videoDevices[currentDeviceIndex].deviceId);
      }
    });
  </script>
</body>
</html>
