<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>38Racing - Pit Telemetry HUD (Receiver & Auto Recorder)</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(12, 17, 26, 0.84);
      --border: rgba(88, 114, 152, 0.42);
      --text: #f3f6fc;
      --muted: #8fa3bf;
      --cyan: #22d3ee;
      --gold: #fbbf24;
      --amber: #f59e0b;
      --red: #ef4444;
      --green: #22c55e;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 上部コントロールバー */
    .topbar {
      height: 52px;
      background: #0b1019;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 10px;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #1e293b;
      color: var(--muted);
    }
    .status-pill.online { background: rgba(34, 197, 94, 0.18); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.5); }
    .status-pill.rec { background: rgba(239, 68, 68, 0.22); color: #ff6b6b; border: 1px solid var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .input-group {
      display: flex;
      align-items: center;
      background: #131b29;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .input-group span { color: var(--muted); margin-right: 6px; font-weight: 700; }
    .input-group input, .input-group select {
      background: transparent;
      border: none;
      color: var(--cyan);
      font-weight: 800;
      font-size: 13px;
      width: 72px;
      outline: none;
    }
    .input-group select { width: 130px; color: var(--text); }
    button {
      border: 1px solid var(--border);
      background: #162033;
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    button:hover { filter: brightness(1.15); }
    button.primary { background: #1d4ed8; border-color: #3b82f6; }
    button.active { background: rgba(34, 197, 94, 0.22); border-color: var(--green); color: var(--green); }
    button.danger { background: rgba(239, 68, 68, 0.22); border-color: var(--red); color: #fca5a5; }

    /* メイン映像＋HUDステージ */
    .stage {
      position: relative;
      flex: 1;
      width: 100%;
      background: radial-gradient(circle at center, #0e1522 0%, #040609 100%);
      overflow: hidden;
    }
    #remoteVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    #hudCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .wait-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 12, 20, 0.86);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 32px;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }
    .wait-banner h2 { font-size: 18px; color: var(--cyan); margin-bottom: 8px; }
    .wait-banner p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span style="color:#ef4444;font-style:italic;">38RACING</span>
      <span style="font-size:13px;color:#cbd5e1;">PIT TELEMETRY HUD</span>
      <span id="connStatus" class="status-pill">● PIT STANDBY</span>
      <span id="recStatus" class="status-pill">REC: IDLE</span>
    </div>

    <div class="controls">
      <div class="input-group">
        <span>CIRCUIT</span>
        <select id="circuitSelect">
          <option value="FSW">富士スピードウェイ (FSW)</option>
          <option value="MOTEGI">モビリティリゾートもてぎ</option>
          <option value="TSUKUBA">筑波サーキット TC2000</option>
          <option value="NIKKO">日光サーキット</option>
          <option value="SODEGAURA">袖ヶ浦フォレスト</option>
        </select>
      </div>

      <div class="input-group">
        <span>ROOM</span>
        <input id="roomInput" type="text" value="ND-27" />
      </div>

      <button id="btnLink" class="primary" onclick="connectToCar()">LINK CAR</button>
      <button id="btnAutoRec" class="active" onclick="toggleAutoRec()">AUTO REC: ON</button>
      <button id="btnManualRec" onclick="toggleManualRec()">● REC</button>
      <button id="btnExportCsv" onclick="exportCsvLog()">CSV保存</button>
      <button id="btnSim" onclick="toggleSim()">SIM: OFF</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <canvas id="hudCanvas"></canvas>

    <div class="wait-banner" id="waitBanner">
      <h2>PIT RECEIVER READY (受信待機中)</h2>
      <p>
        車載スマホの <b>incar_transmitter.html</b> で「2. START TX」を押し、<br>
        上の <b>「LINK CAR」</b> をクリックするとオンボード映像とテレメトリを受信します。<br>
        <span style="color:#fbbf24;">※右上の「SIM: OFF」を押すと単体でHUD表示テストができます</span>
      </p>
    </div>
  </div>

<script>
  // --- サーキット簡易コース座標（正規化 0..1） ---
  const CIRCUITS = {
    FSW: {
      name: "FUJI SPEEDWAY",
      len: 4563,
      pts: [[0.15,0.48],[0.78,0.48],[0.86,0.42],[0.82,0.32],[0.64,0.33],[0.55,0.42],[0.45,0.28],[0.32,0.28],[0.38,0.52],[0.26,0.62],[0.18,0.72],[0.08,0.64],[0.15,0.48]]
    },
    MOTEGI: {
      name: "MOBILITY RESORT MOTEGI",
      len: 4801,
      pts: [[0.20,0.65],[0.62,0.65],[0.72,0.55],[0.60,0.42],[0.78,0.32],[0.88,0.45],[0.82,0.74],[0.48,0.78],[0.35,0.55],[0.16,0.50],[0.20,0.65]]
    },
    TSUKUBA: {
      name: "TSUKUBA CIRCUIT TC2000",
      len: 2045,
      pts: [[0.22,0.70],[0.65,0.70],[0.78,0.58],[0.66,0.46],[0.45,0.52],[0.35,0.35],[0.76,0.28],[0.86,0.42],[0.40,0.78],[0.18,0.76],[0.22,0.70]]
    },
    NIKKO: {
      name: "NIKKO CIRCUIT",
      len: 1052,
      pts: [[0.20,0.68],[0.75,0.68],[0.84,0.52],[0.68,0.36],[0.52,0.50],[0.36,0.34],[0.18,0.46],[0.20,0.68]]
    },
    SODEGAURA: {
      name: "SODEGAURA FOREST RACEWAY",
      len: 2436,
      pts: [[0.18,0.62],[0.72,0.62],[0.84,0.48],[0.74,0.30],[0.52,0.34],[0.44,0.50],[0.28,0.36],[0.14,0.50],[0.18,0.62]]
    }
  };

  // --- テレメトリ状態 ---
  let telem = {
    spd: 0, rpm: 900, gear: 1, thr: 0, brk: 0,
    gx: 0, gy: 0, steer: 0, wtemp: 86,
    lap: 1, distM: 0, lapTime: 0, lastLap: 115.016, bestLap: 114.596,
    s1: 24.699, s2: 42.780, s3: 46.456,
    dS1: -0.11, dS2: -0.34, dS3: -0.21, liveDelta: -0.18,
    lat: 35.3717, lon: 138.9272
  };

  const traceHist = []; // 4ch オシロスコープ履歴 (thr, brk, spd, gx)
  const MAX_TRACE = 180;
  const csvRows = ["timestamp,lap,distM,lapTime,spd,rpm,gear,thr,brk,gx,gy,steer,wtemp"];

  let peer = null;
  let dataConn = null;
  let mediaCall = null;
  let hasVideoStream = false;
  let simActive = false;
  let simPhase = 0;

  // --- 自動録画関連 ---
  let autoRecEnabled = true;
  let isRecording = false;
  let mediaRecorder = null;
  let recordedChunks = [];
  let belowSpeedSince = null;

  const videoEl = document.getElementById("remoteVideo");
  const canvas = document.getElementById("hudCanvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    const stage = document.getElementById("stage");
    canvas.width = stage.clientWidth;
    canvas.height = stage.clientHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // --- WebRTC / PeerJS 接続（着信待機 ＋ 車載側への発信の両面対応） ---
  function initPeer() {
    if (peer) { try { peer.destroy(); } catch (e) {} }
    const room = document.getElementById("roomInput").value.trim() || "ND-27";
    const pitId = `38racing-pit-${room}`;

    peer = new Peer(pitId, { debug: 1 });

    peer.on("open", (id) => {
      setConnStatus(`● PIT READY (${room})`, false);
    });

    // 車載スマホ側から発信された場合
    peer.on("connection", (conn) => {
      bindDataConnection(conn);
    });

    peer.on("call", (call) => {
      call.answer();
      bindMediaCall(call);
    });

    peer.on("error", (err) => {
      if (err.type === "unavailable-id") {
        // ID重複時はランダムsuffixで起動し、発信接続で繋ぐ
        peer = new Peer(undefined, { debug: 1 });
        peer.on("open", () => setConnStatus(`● PIT CLIENT (${room})`, false));
      }
    });
  }

  function connectToCar() {
    if (!peer || peer.disconnected) initPeer();
    const room = document.getElementById("roomInput").value.trim() || "ND-27";
    setConnStatus(`● LINKING ${room}...`, false);

    // 車載側が待機している可能性のあるPeer ID候補へ接続を試行
    const candidateIds = [
      `38racing-car-${room}`,
      `incar-${room}`,
      `car-${room}`,
      `${room}-car`
    ];

    candidateIds.forEach((targetId) => {
      try {
        const conn = peer.connect(targetId, { reliable: false });
        conn.on("open", () => {
          bindDataConnection(conn);
          // 映像ストリーム要求用のダミーコール
          const emptyCanvas = document.createElement("canvas");
          emptyCanvas.width = 16; emptyCanvas.height = 16;
          const dummyStream = emptyCanvas.captureStream(1);
          const call = peer.call(targetId, dummyStream);
          if (call) bindMediaCall(call);
        });
      } catch (e) {}
    });
  }

  function bindDataConnection(conn) {
    dataConn = conn;
    const room = document.getElementById("roomInput").value.trim() || "ND-27";
    setConnStatus(`● LINKED (${room})`, true);
    document.getElementById("waitBanner").style.display = "none";

    conn.on("data", (raw) => {
      try {
        const d = (typeof raw === "string") ? JSON.parse(raw) : raw;
        Object.assign(telem, d);
        simActive = false;
        document.getElementById("btnSim").textContent = "SIM: OFF";
        document.getElementById("btnSim").classList.remove("active");
        recordTelemetrySample();
      } catch (e) {}
    });

    conn.on("close", () => {
      setConnStatus(`● DISCONNECTED (${room})`, false);
    });
  }

  function bindMediaCall(call) {
    mediaCall = call;
    call.on("stream", (stream) => {
      videoEl.srcObject = stream;
      hasVideoStream = true;
      document.getElementById("waitBanner").style.display = "none";
    });
  }

  function setConnStatus(text, isOnline) {
    const el = document.getElementById("connStatus");
    el.textContent = text;
    el.className = isOnline ? "status-pill online" : "status-pill";
  }

  // --- 自動録画（車速 10km/h 以上で開始、停止10秒で保存） ---
  function toggleAutoRec() {
    autoRecEnabled = !autoRecEnabled;
    const btn = document.getElementById("btnAutoRec");
    btn.textContent = autoRecEnabled ? "AUTO REC: ON" : "AUTO REC: OFF";
    btn.classList.toggle("active", autoRecEnabled);
  }

  function toggleManualRec() {
    if (isRecording) stopRecording();
    else startRecording();
  }

  function startRecording() {
    if (isRecording) return;
    try {
      // HUD合成キャンバスを録画（映像＋HUD焼込）
      const stream = canvas.captureStream(30);
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveRecordedVideo;
      mediaRecorder.start(1000);
      isRecording = true;
      const pill = document.getElementById("recStatus");
      pill.textContent = "● REC (HUD BURN-IN)";
      pill.className = "status-pill rec";
      document.getElementById("btnManualRec").classList.add("danger");
    } catch (e) {
      console.warn("MediaRecorder unavailable:", e);
    }
  }

  function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    isRecording = false;
    mediaRecorder.stop();
    const pill = document.getElementById("recStatus");
    pill.textContent = "REC: SAVED";
    pill.className = "status-pill";
    document.getElementById("btnManualRec").classList.remove("danger");
  }

  function saveRecordedVideo() {
    if (recordedChunks.length === 0) return;
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    a.href = url;
    a.download = `38Racing_Onboard_HUD_${ts}.webm`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function recordTelemetrySample() {
    traceHist.push({ thr: telem.thr, brk: telem.brk, spd: telem.spd, gx: telem.gx });
    if (traceHist.length > MAX_TRACE) traceHist.shift();

    csvRows.push([
      Date.now(), telem.lap, telem.distM.toFixed(1), telem.lapTime.toFixed(3),
      telem.spd.toFixed(1), telem.rpm, telem.gear, telem.thr, telem.brk,
      telem.gx.toFixed(2), telem.gy.toFixed(2), telem.steer.toFixed(1), telem.wtemp
    ].join(","));

    // 車速連動オート録画判定
    if (autoRecEnabled) {
      if (telem.spd >= 10) {
        belowSpeedSince = null;
        if (!isRecording) startRecording();
      } else if (isRecording) {
        if (!belowSpeedSince) belowSpeedSince = Date.now();
        if (Date.now() - belowSpeedSince > 10000) stopRecording();
      }
    }
  }

  function exportCsvLog() {
    const blob = new Blob([csvRows.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `38Racing_Telemetry_${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function toggleSim() {
    simActive = !simActive;
    const btn = document.getElementById("btnSim");
    btn.textContent = simActive ? "SIM: ON" : "SIM: OFF";
    btn.classList.toggle("active", simActive);
    document.getElementById("waitBanner").style.display = (simActive || hasVideoStream || dataConn) ? "none" : "block";
  }

  function formatLap(sec) {
    const s = Math.max(0, sec || 0);
    const m = Math.floor(s / 60);
    const r = (s - m * 60).toFixed(2).padStart(5, "0");
    return `${m}'${r}`;
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // --- 60fps GT7風 HUD 描画ループ ---
  function renderHUD() {
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // 受信映像がある場合はHUDキャンバスにも転写（録画焼込用）
    if (hasVideoStream && videoEl.readyState >= 2) {
      ctx.drawImage(videoEl, 0, 0, W, H);
    }

    // 1. 最上部 15連シフトLEDバー
    const ledCount = 15;
    const ledTotalW = Math.min(760, W * 0.56);
    const ledStartX = (W - ledTotalW) / 2;
    const ledGap = 6;
    const ledW = (ledTotalW - ledGap * (ledCount - 1)) / ledCount;
    const revLim = 7000;
    const ratio = telem.rpm / revLim;
    const flash = (telem.rpm >= revLim) && (Math.floor(Date.now() / 65) % 2 === 0);

    for (let i = 0; i < ledCount; i++) {
      const thresh = 0.50 + (0.50 * i / (ledCount - 1));
      let col = "rgba(30,41,59,0.75)";
      if (telem.rpm >= revLim) {
        col = flash ? "#ef4444" : "rgba(30,41,59,0.75)";
      } else if (ratio >= thresh) {
        col = i < 5 ? "#22c55e" : i < 10 ? "#f59e0b" : "#ef4444";
      }
      ctx.fillStyle = col;
      roundRect(ctx, ledStartX + i * (ledW + ledGap), 12, ledW, 14, 4);
      ctx.fill();
    }

    // 2. 左上：サーキットコースマップ ＆ 自車ドット
    const cKey = document.getElementById("circuitSelect").value;
    const circuit = CIRCUITS[cKey] || CIRCUITS.FSW;
    const mapX = 20, mapY = 24, mapW = 240, mapH = 175;
    ctx.fillStyle = "rgba(10, 15, 24, 0.78)";
    ctx.strokeStyle = "rgba(88, 114, 152, 0.45)";
    ctx.lineWidth = 1.5;
    roundRect(ctx, mapX, mapY, mapW, mapH, 10);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#22d3ee";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(circuit.name, mapX + 12, mapY + 18);

    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 4;
    ctx.beginPath();
    circuit.pts.forEach((p, idx) => {
      const px = mapX + 16 + p[0] * (mapW - 32);
      const py = mapY + 24 + p[1] * (mapH - 36);
      if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();

    // 走行距離割合からコース上の自車ドット位置を計算
    const prog = ((telem.distM || 0) % circuit.len) / circuit.len;
    const segFloat = prog * (circuit.pts.length - 1);
    const segIdx = Math.floor(segFloat);
    const segT = segFloat - segIdx;
    const pA = circuit.pts[segIdx] || circuit.pts[0];
    const pB = circuit.pts[segIdx + 1] || circuit.pts[0];
    const carX = mapX + 16 + (pA[0] + (pB[0] - pA[0]) * segT) * (mapW - 32);
    const carY = mapY + 24 + (pA[1] + (pB[1] - pA[1]) * segT) * (mapH - 36);
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath(); ctx.arc(carX, carY, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();

    // 3. 右上：ラップ・セクタータイムボード
    const secW = 290, secH = 215, secX = W - secW - 20, secY = 24;
    ctx.fillStyle = "rgba(10, 15, 24, 0.80)";
    ctx.strokeStyle = "rgba(88, 114, 152, 0.45)";
    roundRect(ctx, secX, secY, secW, secH, 10);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#22d3ee";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(`LAP ${telem.lap}  (${Math.round(telem.distM)}m)`, secX + 14, secY + 22);

    ctx.fillStyle = "#ffffff";
    ctx.font = "italic 900 32px sans-serif";
    ctx.fillText(formatLap(telem.lapTime), secX + 14, secY + 58);

    const dPos = (telem.liveDelta || 0) <= 0;
    ctx.fillStyle = dPos ? "#2563eb" : "#ef4444";
    roundRect(ctx, secX + secW - 92, secY + 32, 78, 30, 6);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText(`${telem.liveDelta >= 0 ? "+" : ""}${telem.liveDelta.toFixed(2)}`, secX + secW - 84, secY + 52);

    const rows = [
      { lbl: "S1", val: formatLap(telem.s1), d: telem.dS1 },
      { lbl: "S2", val: formatLap(telem.s2), d: telem.dS2 },
      { lbl: "S3", val: formatLap(telem.s3), d: telem.dS3 },
      { lbl: "LAST", val: formatLap(telem.lastLap), d: null },
      { lbl: "BEST", val: formatLap(telem.bestLap), d: null }
    ];
    rows.forEach((r, idx) => {
      const ry = secY + 86 + idx * 25;
      ctx.fillStyle = idx === 4 ? "#22c55e" : "#94a3b8";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText(r.lbl, secX + 14, ry);

      ctx.fillStyle = idx === 4 ? "#22c55e" : "#f8fafc";
      ctx.font = "italic bold 16px sans-serif";
      ctx.fillText(r.val, secX + 82, ry);

      if (r.d !== null) {
        ctx.fillStyle = r.d <= 0 ? "#38bdf8" : "#f87171";
        ctx.font = "bold 13px sans-serif";
        ctx.fillText(`${r.d >= 0 ? "+" : ""}${r.d.toFixed(2)}`, secX + 215, ry);
      }
    });

    // 4. 下部中央：GT7風スピード・ギア・ペダルバー
    const hudW = 460, hudH = 136, hudX = (W - hudW) / 2, hudY = H - hudH - 18;
    ctx.fillStyle = "rgba(10, 15, 24, 0.84)";
    ctx.strokeStyle = "rgba(88, 114, 152, 0.5)";
    roundRect(ctx, hudX, hudY, hudW, hudH, 12);
    ctx.fill(); ctx.stroke();

    // タコメーター横バー
    const barW = hudW - 32;
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(hudX + 16, hudY + 14, barW, 12);
    ctx.fillStyle = telem.rpm >= revLim ? "#ef4444" : "#fbbf24";
    ctx.fillRect(hudX + 16, hudY + 14, barW * Math.min(1, telem.rpm / 8000), 12);

    // ギア表示
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 2;
    roundRect(ctx, hudX + 18, hudY + 38, 72, 82, 8);
    ctx.stroke();
    ctx.fillStyle = "#f59e0b";
    ctx.font = "italic 900 54px sans-serif";
    ctx.fillText(String(telem.gear || 1), hudX + 36, hudY + 98);

    // 車速 & RPM
    ctx.fillStyle = "#ffffff";
    ctx.font = "italic 900 62px sans-serif";
    ctx.fillText(String(Math.round(telem.spd)).padStart(3, " "), hudX + 110, hudY + 98);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("km/h", hudX + 235, hudY + 98);
    ctx.fillStyle = "#fbbf24";
    ctx.fillText(`${Math.round(telem.rpm)} rpm  |  WT ${telem.wtemp}°C`, hudX + 112, hudY + 118);

    // ブレーキ（赤）＆ アクセル（緑）縦バー
    const drawPedalBar = (bx, pct, color, label) => {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(bx, hudY + 38, 28, 82);
      const fh = 82 * (Math.min(100, Math.max(0, pct)) / 100);
      ctx.fillStyle = color;
      ctx.fillRect(bx, hudY + 38 + (82 - fh), 28, fh);
      ctx.fillStyle = "#cbd5e1";
      ctx.font = "bold 10px sans-serif";
      ctx.fillText(label, bx + 3, hudY + 131);
    };
    drawPedalBar(hudX + hudW - 92, telem.brk, "#ef4444", "BRK");
    drawPedalBar(hudX + hudW - 48, telem.thr, "#22c55e", "THR");

    // 5. 左下：Gボール（摩擦円）
    const gRad = 64, gCx = 94, gCy = H - gRad - 22;
    ctx.fillStyle = "rgba(10, 15, 24, 0.82)";
    ctx.beginPath(); ctx.arc(gCx, gCy, gRad, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(88, 114, 152, 0.5)"; ctx.stroke();
    ctx.beginPath(); ctx.arc(gCx, gCy, gRad * 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gCx - gRad, gCy); ctx.lineTo(gCx + gRad, gCy);
    ctx.moveTo(gCx, gCy - gRad); ctx.lineTo(gCx, gCy + gRad);
    ctx.stroke();

    const dotX = gCx + Math.max(-1, Math.min(1, telem.gy / 1.5)) * (gRad - 8);
    const dotY = gCy - Math.max(-1, Math.min(1, telem.gx / 1.5)) * (gRad - 8);
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath(); ctx.arc(dotX, dotY, 7, 0, Math.PI * 2); ctx.fill();

    // 6. 右下：4ch 細線オシロスコープ
    const oscW = 290, oscH = 128, oscX = W - oscW - 20, oscY = H - oscH - 22;
    ctx.fillStyle = "rgba(10, 15, 24, 0.82)";
    ctx.strokeStyle = "rgba(88, 114, 152, 0.45)";
    roundRect(ctx, oscX, oscY, oscW, oscH, 10);
    ctx.fill(); ctx.stroke();

    const drawTrace = (getter, color) => {
      if (traceHist.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      traceHist.forEach((pt, idx) => {
        const tx = oscX + 8 + (idx / (MAX_TRACE - 1)) * (oscW - 16);
        const val = Math.max(0, Math.min(1, getter(pt)));
        const ty = oscY + oscH - 10 - val * (oscH - 24);
        if (idx === 0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty);
      });
      ctx.stroke();
    };
    drawTrace(p => p.thr / 100, "#22c55e");
    drawTrace(p => p.brk / 100, "#ef4444");
    drawTrace(p => p.spd / 240, "#22d3ee");
    drawTrace(p => (p.gx + 1.5) / 3.0, "#fbbf24");

    requestAnimationFrame(renderHUD);
  }

  // --- 単体HUD表示シミュレーション用タイマー ---
  setInterval(() => {
    if (!simActive) return;
    simPhase += 0.04;
    const w = Math.sin(simPhase);
    telem.brk = w < -0.25 ? Math.min(100, Math.round((-w - 0.25) * 140)) : 0;
    telem.thr = telem.brk === 0 ? Math.min(100, Math.round((w + 0.3) * 90)) : 0;
    telem.spd = 138 + w * 62;
    telem.rpm = 3800 + Math.abs(Math.sin(simPhase * 1.4)) * 3600;
    telem.gear = telem.spd > 170 ? 5 : telem.spd > 130 ? 4 : telem.spd > 92 ? 3 : 2;
    telem.gx = telem.brk > 0 ? -telem.brk * 0.012 : telem.thr * 0.004;
    telem.gy = Math.cos(simPhase * 0.7) * 1.2;
    telem.distM += (telem.spd / 3.6) * 0.04;
    telem.lapTime += 0.04;
    recordTelemetrySample();
  }, 40);

  initPeer();
  renderHUD();
</script>
</body>
</html>
